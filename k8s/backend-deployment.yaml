apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: utkarsh4115e/giftlink-backend:v3
          imagePullPolicy: Always

          ports:
            - containerPort: 3060

          envFrom:
            - configMapRef:
                name: backend-config